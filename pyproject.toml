[project]
name = "ollamasearch"
version = "0.2.0"
description = "Private web search for local Ollama models, plus SearchBench: a reproducible benchmark of how well small models use search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nurasik14" }]
requires-python = ">=3.11"
keywords = ["ollama", "llm", "rag", "searxng", "benchmark", "web-search", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
# third-party benchmark datasets published as Parquet (HotpotQA on the Hugging Face Hub)
datasets = ["pyarrow>=15"]

[project.scripts]
ollamasearch = "ollamasearch.cli:app"

[project.urls]
Repository = "https://github.com/nurasik14/OllamaSearch"

[dependency-groups]
dev = [
    "pytest>=8,<9.1",
    "pytest-benchmark>=4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "beautifulsoup4>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollamasearch"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bench/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic/Kazakh text is intentional
    "SIM905",  # keep stopword lists as readable split strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH"]
"benchmarks/**" = ["PTH"]
"scripts/make_readme_art.py" = ["E501"]  # inline SVG markup

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ollamasearch"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "truststore"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: slower tests"]

[tool.coverage.run]
source = ["ollamasearch"]
branch = true
